name: Build macOS Universal DMG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: Intel
            prefix: "arch -x86_64"
          - runner: macos-14
            arch: AppleSilicon
            prefix: ""
    runs-on: ${{ matrix.runner }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        ${{ matrix.prefix }} python -m pip install --upgrade pip
        ${{ matrix.prefix }} pip install pyinstaller Cython setuptools customtkinter faster-whisper Pillow ffpyplayer pyjwt cryptography torch torchvision torchaudio ctranslate2 pyannote-audio asteroid-filterbanks pytorch-lightning
        
    - name: Create core binaries with Cython
      run: |
        ${{ matrix.prefix }} python setup_cython.py build_ext --inplace
        echo "✅ Cython compilation successful"
        
    - name: Download Whisper Models
      run: |
        mkdir -p model_cache/whisper
        ${{ matrix.prefix }} python -c "
        from huggingface_hub import snapshot_download
        import os
        models = ['tiny']
        for m in models:
            print(f'Downloading {m}...')
            snapshot_download(
                repo_id=f'systran/faster-whisper-{m}',
                local_dir=f'model_cache/whisper/{m}',
                local_dir_use_symlinks=False
            )
        "
        echo "✅ Models downloaded successfully"

    - name: Build with PyInstaller
      run: |
        # Creiamo un'icona icns fittizia se non esiste per evitare errori di build
        if [ ! -f assets/icon.icns ]; then
          mkdir -p assets
          cp assets/icon.ico assets/icon.icns || touch assets/icon.icns
        fi
        
        # Spostiamo i file .py di core per proteggere il codice
        mkdir core_backup
        for f in database hardware licensing transcriber watcher diarizer; do
          if [ -f core/$f.py ]; then
            mv core/$f.py core_backup/
          fi
        done
        echo "🔒 Nascosti i file sorgente .py in core_backup/"

        # Esecuzione PyInstaller
        ${{ matrix.prefix }} python -m PyInstaller vocius_persona_macos.spec --noconfirm

        # Ripristiniamo i file .py originali
        if [ -d core_backup ] && [ "$(ls -A core_backup)" ]; then
          mv core_backup/*.py core/
          rmdir core_backup
          echo "🔄 Ripristinati i file sorgente .py in core/"
        else
          [ -d core_backup ] && rmdir core_backup
        fi

    - name: Compress App Bundle
      run: |
        cd dist
        tar -czf ../Vocius_Persona_${{ matrix.arch }}.tar.gz "Vocius Persona.app"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vocius-Persona-app-${{ matrix.arch }}
        path: Vocius_Persona_${{ matrix.arch }}.tar.gz

  package:
    needs: build
    runs-on: macos-latest
    steps:
    - name: Download Intel Artifact
      uses: actions/download-artifact@v4
      with:
        name: Vocius-Persona-app-Intel

    - name: Download AppleSilicon Artifact
      uses: actions/download-artifact@v4
      with:
        name: Vocius-Persona-app-AppleSilicon

    - name: Extract and Rename App Bundles
      run: |
        mkdir -p dmg_folder
        tar -xzf Vocius_Persona_Intel.tar.gz -C dmg_folder
        mv "dmg_folder/Vocius Persona.app" "dmg_folder/Vocius Persona (Intel).app"
        
        tar -xzf Vocius_Persona_AppleSilicon.tar.gz -C dmg_folder
        mv "dmg_folder/Vocius Persona.app" "dmg_folder/Vocius Persona (Apple Silicon).app"

    - name: Create Single Universal DMG
      run: |
        brew install create-dmg
        create-dmg \
          --volname "Vocius Persona Installer" \
          --window-pos 200 120 \
          --window-size 650 450 \
          --icon-size 100 \
          --icon "Vocius Persona (Apple Silicon).app" 150 150 \
          --icon "Vocius Persona (Intel).app" 350 150 \
          --hide-extension "Vocius Persona (Apple Silicon).app" \
          --hide-extension "Vocius Persona (Intel).app" \
          --app-drop-link 550 150 \
          "Vocius_Persona_macOS_Universal.dmg" \
          "dmg_folder"

    - name: Upload Universal DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vocius-Persona-macOS-Universal-DMG
        path: Vocius_Persona_macOS_Universal.dmg
