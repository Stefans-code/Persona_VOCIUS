name: Build Windows installer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VOCIUS_VERSION: "1.0.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # torch CPU: serve solo per rilevare l'hardware (la trascrizione la fa CTranslate2).
      # La build CUDA di torch peserebbe ~2,5 GB in piu' nell'installer.
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller Cython setuptools customtkinter faster-whisper huggingface_hub Pillow ffpyplayer pyjwt cryptography

      - name: Protezione codice (Cython -> .pyd)
        shell: pwsh
        run: python setup_cython.py build_ext --inplace

      - name: Build (PyInstaller)
        shell: pwsh
        run: |
          # i sorgenti .py di core restano fuori dal pacchetto: dentro vanno solo i .pyd compilati
          New-Item -ItemType Directory -Force core_backup | Out-Null
          foreach ($f in 'database','hardware','licensing','transcriber','watcher','diarizer') {
            if (Test-Path "core/$f.py") { Move-Item "core/$f.py" core_backup/ }
          }
          python -m PyInstaller vocius_persona_windows.spec --noconfirm
          Move-Item core_backup/*.py core/
          if (-not (Test-Path dist/Vocius/Vocius.exe)) { throw "Vocius.exe non prodotto" }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          # Il contratto in UTF-8 con BOM, altrimenti Inno Setup sbaglia le lettere accentate
          $t = Get-Content license.txt -Raw -Encoding utf8
          [System.IO.File]::WriteAllText("$PWD\license_installer.txt", $t, (New-Object System.Text.UTF8Encoding $true))
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_windows.iss
          if (-not (Test-Path installer_out/Vocius_Setup.exe)) { throw "installer non prodotto" }

      - uses: actions/upload-artifact@v4
        with:
          name: Vocius-Windows
          path: installer_out/Vocius_Setup.exe
